<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ilham- Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #ea2603, #3344ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: rgb(34, 19, 83);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 320px;
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #333333;
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      background: #722121;
      color: rgb(255, 255, 255);
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login-container button:hover {
      background: #531ee6;
    }

    .error-message {
      margin-top: 10px;
      color: red;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Portal Galaxy</h2>
    <form onsubmit="return loginUser(event)">
      <input type="text" id="username" placeholder="Nama Ultra" required />
      <input type="password" id="password" placeholder="Password Ultra" required />
      <button type="submit">Masuk</button>
      <p class="error-message" id="error-message"></p>
    </form>
  </div>

  <script>
    function loginUser(event) {
      event.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (username === 'lIham Dyno' && password === 'UltraBrother123') {
        window.location.href = 'hal1.html';
      } else {
        document.getElementById('error-message').textContent = 'Coba lagi, bro! Nama atau password salah.';
      }
    }
  </script>
</body>
</html>
